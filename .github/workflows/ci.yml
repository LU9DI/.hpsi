name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

# Serialize runs per ref so concurrent runs on the same branch do not overlap.
concurrency:
  group: hpsi-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  python-capture-tools:
    name: Python capture utility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The auditor suite is pytest-style and imports pytest and NumPy; without
      # them `unittest discover` cannot even import the module. Discovery is
      # kept because the capture-tool tests are unittest cases, but it cannot
      # collect a pytest suite, so pytest runs as its own step.
      - name: Install test dependencies
        run: python -m pip install pytest numpy
      - name: Compile capture utility
        run: python -m py_compile tools/capture_transformer_activations.py
      - name: Test capture utility helpers
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Test the independent container auditor
        run: python -m pytest tests -q
  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

  vq-benchmark:
    name: Direct VQ CPU benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Run deterministic VQ benchmark
        run: cargo run -p hpsi-ops --example vq_benchmark --release

  fuzz-smoke:
    name: Fuzz target build (nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check fuzz target formatting
        working-directory: fuzz
        run: cargo +nightly fmt -- --check

      - name: Compile libFuzzer targets
        working-directory: fuzz
        run: cargo +nightly check --bins

  # Tools and action commits are pinned; see
  # docs/audits/2026-11-10-hpsi-ci-security-enforcement.md for the audited SHAs.
  security:
    name: Security and license gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install project Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Install audit and license tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Audit workspace dependencies
        run: cargo audit

      - name: Enforce root dependency policy
        run: cargo deny --config deny.toml check

      - name: Enforce fuzz workspace dependency policy
        working-directory: fuzz
        run: cargo deny --config deny.toml check
