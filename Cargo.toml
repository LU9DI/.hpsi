[workspace]
members = ["crates/hpsi-format", "apps/hpsi-cli", "crates/hpsi-ops"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LU9DI/.hpsi"

[workspace.dependencies]
hpsi-format = { path = "crates/hpsi-format", version = "0.1.0" }
hpsi-ops = { path = "crates/hpsi-ops", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
