name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

# Serialize runs per ref so concurrent runs on the same branch do not overlap.
concurrency:
  group: hpsi-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  python-capture-tools:
    name: Python capture utility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile capture utility
        run: python -m py_compile tools/capture_transformer_activations.py
      - name: Test capture utility helpers
        run: python -m unittest discover -s tests -p "test_*.py"
  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

  vq-benchmark:
    name: Direct VQ CPU benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Run deterministic VQ benchmark
        run: cargo run -p hpsi-ops --example vq_benchmark --release

  fuzz-smoke:
    name: Fuzz target build (nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check fuzz target formatting
        working-directory: fuzz
        run: cargo +nightly fmt -- --check

      - name: Compile libFuzzer targets
        working-directory: fuzz
        run: cargo +nightly check --bins
